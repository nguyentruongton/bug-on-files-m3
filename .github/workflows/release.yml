name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install frontend dependencies
        run: bun install

      - name: Verify version sync across package.json, Cargo.toml, and PKGBUILD
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          CARGO_VER=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          PKGBUILD_VER=$(grep -m1 '^pkgver=' PKGBUILD | cut -d'=' -f2)
          echo "package.json=$PKG_VER Cargo.toml=$CARGO_VER PKGBUILD=$PKGBUILD_VER"
          test "$PKG_VER" = "$CARGO_VER"
          test "$PKG_VER" = "$PKGBUILD_VER"
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            test "$PKG_VER" = "$TAG_VER"
          fi

      - name: Disable local Cargo sccache/mold config on CI runner
        run: rm -f src-tauri/.cargo/config.toml

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Bug On Files M3 v__VERSION__'
          releaseBody: 'Pre-built Linux packages (`.AppImage`, `.deb`) for **Bug On Files M3** (*Bất Ổn Files M3*).'
          releaseDraft: false
          prerelease: false
